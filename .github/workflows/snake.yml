# Generates the animated contribution graph shown in the profile README.
# Output is pushed to the "output" branch of this repo (mshobin/mshobin).
# Tip: turn on Settings → Profile → "Include private contributions on my profile" so
# work in private repos (A.R.Q., Kingdom Connect) shows up on the graph.
name: Contribution graph

on:
  schedule:
    - cron: "17 3 * * *"   # daily, 06:17 Kuwait time
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg
            dist/github-snake-dark.svg?palette=github-dark

      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
